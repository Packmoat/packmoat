apiVersion: v2
name: packmoat
description: >-
  One copy of the Packmoat server (the core image) on Kubernetes: one pod, its SQLite database on a ReadWriteOnce volume, secrets read
  from files. See docs/self-hosting.md, section 10.
type: application
# The chart's own version. Charts are not published yet.
version: 0.1.0
# The image tag used when image.tag and image.digest are both empty. There are no release images yet: main is the newest build.
appVersion: "main"
# 1.29: ReadWriteOncePod, which the data claim uses, is generally available from Kubernetes 1.29.
kubeVersion: ">=1.29.0-0"
