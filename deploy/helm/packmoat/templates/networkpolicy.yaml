{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller may reach the server, so only it can send the X-Forwarded-* headers that trustedProxies believes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "packmoat.fullname" . }}
  labels:
    {{- include "packmoat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "packmoat.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
          {{- with .Values.networkPolicy.ingressPodLabels }}
          podSelector:
            matchLabels:
              {{- range $k, $v := . }}
              {{ $k | quote }}: {{ $v | quote }}
              {{- end }}
          {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
