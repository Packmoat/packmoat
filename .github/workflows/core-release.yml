# A release: when a version tag (vX.Y.Z) is pushed, name the core image that main already built and signed for that commit
# (sha-<commit>, from core-image.yml) as X.Y.Z, and as X.Y and latest when this is the highest version. Nothing is built, pushed by
# digest, signed or attested here: a rebuild under a tag would be a different image (a new digest), signed as this workflow on a tag, not
# as core-image.yml on main, and every documented cosign and attestation check would then fail. Retagging copies the signed index as it
# is, so a release tag names the very digest main signed, with the signature, SBOMs and provenance it already has.
# This guards against mistakes, not against someone who can push a tag or change this file: the controls for that are the tag ruleset and
# who has write access to the repository.
# No secret or key is used: the built-in token logs in to the registry. The token can write packages and read contents, and nothing else.
# The image name is written out: a registry name must be lower case, and the owner of this repository is Packmoat, with a capital P.
# It never runs on a pull request, and the one guard on its job means a fork publishes nothing.
name: core-release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: core-release
  cancel-in-progress: false

jobs:
  retag:
    name: retag
    # Only a version tag of this repository names a release.
    if: github.repository == 'Packmoat/packmoat' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/packmoat/packmoat-core
    steps:
      - name: Check the tag is a release version (vX.Y.Z, no leading zeros, no suffix)
        id: version
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "${GITHUB_REF} is not a release tag (vX.Y.Z)" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image main built and signed for this commit. Its digest is read once, and everything below uses that digest, not a tag.
      - name: Find the digest main published for this commit
        id: source
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:sha-${GITHUB_SHA}" | jq -r .digest)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "no image ${IMAGE}:sha-${GITHUB_SHA}: ${digest}" >&2; exit 1; fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature must be core-image.yml on main AND for this very commit (--certificate-github-workflow-sha), and each platform image
      # must carry this commit as its revision label, so a tag cannot name an image main built for another commit.
      - name: Check that core-image.yml on main signed this commit's index and each platform's image
        id: verify
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" | jq -r '.manifests[].digest')"
          if [[ "$(wc -l <<< "${platforms}")" -ne 2 ]]; then echo "expected 2 platform images, got: ${platforms}" >&2; exit 1; fi
          for p in ${platforms}; do
            if [[ ! "${p}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "not an image digest: ${p}" >&2; exit 1; fi
            revision="$(docker buildx imagetools inspect --format '{{json .Image}}' "${IMAGE}@${p}" | jq -r 'if has("config") then . else (.[] | select(type == "object")) end | (.config.Labels // {})["org.opencontainers.image.revision"] // ""')"
            if [[ "${revision}" != "${GITHUB_SHA}" ]]; then echo "${IMAGE}@${p} is revision ${revision}, not ${GITHUB_SHA}" >&2; exit 1; fi
          done
          for d in "${DIGEST}" ${platforms}; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-image.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "${GITHUB_SHA}" \
              "${IMAGE}@${d}" > /dev/null
            echo "verified ${IMAGE}@${d}"
          done
      # Only now is the image named. X.Y.Z always; X.Y and latest only when this is the highest version (of its minor, of all), so a
      # backport never moves them backwards. An X.Y.Z that already names another image is never moved. With one source, imagetools create
      # copies the index as it is; the check at the end fails the run if a tag did not end up on the signed digest.
      - name: Tag the signed index X.Y.Z, and X.Y and latest when this is the highest
        id: tag
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          set -euo pipefail
          versions=()
          while IFS= read -r v; do versions+=("${v}"); done < <(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' | sed 's#.*refs/tags/v##' | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V)
          if [[ " ${versions[*]} " != *" ${VERSION} "* ]]; then echo "${VERSION} is not among the release tags of ${GITHUB_REPOSITORY}" >&2; exit 1; fi
          if out="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:${VERSION}" 2>&1)"; then
            existing="$(jq -r .digest <<< "${out}")"
            if [[ "${existing}" != "${DIGEST}" ]]; then echo "${IMAGE}:${VERSION} already names ${existing}, not ${DIGEST}: a release tag is never moved" >&2; exit 1; fi
          elif [[ "${out}" != *"not found"* ]]; then
            echo "cannot tell whether ${IMAGE}:${VERSION} exists: ${out}" >&2
            exit 1
          fi
          tags=("${VERSION}")
          if [[ "${versions[${#versions[@]}-1]}" == "${VERSION}" ]]; then tags+=(latest); fi
          minor_highest="$(printf '%s\n' "${versions[@]}" | grep -E "^${MINOR//./\\.}\.[0-9]+$" | tail -n 1)"
          if [[ "${minor_highest}" == "${VERSION}" ]]; then tags+=("${MINOR}"); fi
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "${IMAGE}:${tag}"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for tag in "${tags[@]}"; do
            got="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:${tag}" | jq -r .digest)"
            if [[ "${got}" != "${DIGEST}" ]]; then echo "${IMAGE}:${tag} is ${got}, not the signed ${DIGEST}" >&2; exit 1; fi
            echo "${IMAGE}:${tag} is ${DIGEST}"
          done
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          {
            echo "### Released the core image"
            echo "- image: \`${IMAGE}@${DIGEST}\` (linux/amd64 and linux/arm64), built and signed by main for commit \`${GITHUB_SHA}\`"
            echo "- tags moved: \`${TAGS}\`"
            echo "- signed by: \`https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-image.yml@refs/heads/main\`"
          } >> "$GITHUB_STEP_SUMMARY"
