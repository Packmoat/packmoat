# The Helm chart (deploy/helm/packmoat, #249): helm lint and the chart's own tests (helm template, with what it must render and what it
# must refuse), then an install into a throwaway kind cluster with an image built here, and a smoke test that it serves.
# helm and kind are pinned releases, checked by sha256 (.github/scripts/install-helm-kind.sh). The image is built in the job and loaded
# into the cluster, never pulled. Nothing is pushed or published. No secrets, a read-only token. Actions are pinned to full commit SHAs.
# Every path here is relative to this repository's root.
name: helm

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: helm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned helm and kind (checked by sha256)
        run: |
          .github/scripts/install-helm-kind.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Chart tests (helm lint; helm template, what it renders and what it refuses)
        run: deploy/helm/test-chart.sh
      - name: The image builds from dotnet/ (not pushed)
        working-directory: dotnet
        run: docker build -t packmoat-core:ci .
      - name: Install the chart into kind and smoke-test it (/healthz, /readyz, unprivileged, a restart keeps the database)
        run: .github/scripts/helm-kind-smoke.sh packmoat-core:ci deploy/helm/packmoat
