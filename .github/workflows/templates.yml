# The platform templates, checked offline: no cloud account, no sign-in, nothing deployed, nothing downloaded but the pinned tools.
# The Azure Container Apps template (deploy/azure-container-apps): bicep lint and build, then its tests (jq on the compiled template and
# on the resources bicep snapshot predicts, and what it refuses). The Google Cloud Run template (deploy/cloud-run): tofu fmt, init from the
# pinned provider zip, validate, tflint, then tofu test (plans against a mock provider: what it makes and what it refuses); the AWS ECS
# Fargate template (deploy/aws-ecs) the same way, with the AWS provider unpacked once from its pinned zip. Then each
# test's mutation, which it must catch. One job per template, side by side; the job named templates, the check required on this
# repository, waits for the three and fails unless each succeeded. bicep, OpenTofu, tflint, its Google and AWS rulesets and the Google and AWS providers are pinned releases, checked
# by sha256 (.github/scripts/install-iac-tools.sh); jq is the runner's own. No secrets, a read-only token. Actions are pinned to full
# commit SHAs.
# Every path here is relative to this repository's root.
name: templates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: template (${{ matrix.template }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        template: [azure-container-apps, cloud-run, aws-ecs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned bicep, OpenTofu, tflint, rulesets and Google and AWS providers (checked by sha256)
        run: |
          .github/scripts/install-iac-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Template tests, what it makes and what it refuses (${{ matrix.template }})
        env:
          TEMPLATE: ${{ matrix.template }}
        run: deploy/"$TEMPLATE"/test-template.sh
      - name: Each template test catches its mutation (${{ matrix.template }})
        env:
          TEMPLATE: ${{ matrix.template }}
          MUTATION_JOBS: "4"
        run: deploy/"$TEMPLATE"/test-template.sh --mutations
      - name: The test scripts keep their exit status (a stop under set -u must not end as success)
        run: deploy/test-exit-status.sh

  # One required check for the three legs: it keeps the name this repository's branch protection already requires, and fails unless
  # every leg succeeded (a skipped or cancelled leg counts as a failure).
  templates:
    name: templates
    needs: template
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every template leg succeeded
        env:
          LEGS_RESULT: ${{ needs.template.result }}
        run: |
          echo "template legs: $LEGS_RESULT"
          [[ "$LEGS_RESULT" == "success" ]]
