# The .NET implementation (dotnet/): build, test, check doc-comment references, and build and smoke-test the image. No secrets, a
# read-only token, and nothing is pushed. Actions are pinned to full commit SHAs. Every path here is relative to this repository's root.
name: dotnet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The PostgreSQL the Postgres-backed tests run against. The official image pinned by its index digest (Dependabot does not
    # update a service's digest: refresh it by hand, in every workflow and dotnet/tools/postgres-tests.sh at once; a test keeps them equal).
    # The password is a throwaway for this job's own container, which nothing outside the job can reach.
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: pm-ci-throwaway   # gitleaks:allow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # A PgBouncer in transaction mode in front of postgres, for the pooler test (PACKMOAT_TEST_PGBOUNCER): an idle pool
      # hands two connections one session, which the start must refuse. Pinned by digest, the same as dotnet/tools/pgbouncer-tests.sh
      # (refresh it by hand, every copy at once; a test keeps them equal).
      pgbouncer:
        image: edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: pm-ci-throwaway   # gitleaks:allow
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck the scripts (preinstalled on the runner image)
        run: shellcheck .github/scripts/*.sh deploy/helm/*.sh dotnet/tools/*.sh
      - name: actionlint the workflows (a pinned release, checked by sha256)
        # nullglob: a pattern that matches nothing (no .yaml files) drops out instead of reaching actionlint as a literal name.
        run: |
          shopt -s nullglob
          .github/scripts/actionlint.sh .github/workflows/*.{yml,yaml}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
      - name: Build (warnings are errors)
        working-directory: dotnet
        # MSB9008 (a referenced project does not exist) is only a warning by default: a dangling project reference must fail here.
        run: dotnet build Packmoat.sln -c Release --nologo -warnaserror:MSB9008
      - name: Test (live tests skip without their environment)
        env:
          PACKMOAT_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=pm-ci-throwaway   # gitleaks:allow
          PACKMOAT_TEST_PGBOUNCER: Host=localhost;Port=6432;Database=postgres;Username=postgres;Password=pm-ci-throwaway   # gitleaks:allow
        working-directory: dotnet
        run: dotnet test Packmoat.sln -c Release --no-build --nologo --logger "trx;LogFileName=results.trx" --results-directory "$RUNNER_TEMP/results"
      # A doc comment's cref must resolve. Only the cref checks are errors here (CS1574, CS1580, CS1581, CS1584); the other doc-comment
      # warnings are left as warnings.
      - name: Doc comment references resolve
        working-directory: dotnet
        run: dotnet build Packmoat.sln -c Release --nologo --no-incremental -p:GenerateDocumentationFile=true -p:TreatWarningsAsErrors=false "-p:WarningsAsErrors=CS1574%3BCS1580%3BCS1581%3BCS1584" -warnaserror:MSB9008 -clp:ErrorsOnly
      - name: The image builds from dotnet/ (not pushed)
        working-directory: dotnet
        run: docker build -t packmoat-core:ci .
      - name: Image smoke (Entrypoint, packmoat-admin --help, /healthz 200 with dummy settings)
        run: .github/scripts/image-smoke.sh packmoat-core:ci /app/host/Packmoat.Server.dll
      - name: Image PORT smoke (PORT=9090 moves the server and its health check; PORT=0 stops it)
        run: .github/scripts/port-smoke.sh packmoat-core:ci 9090
      - name: Image PostgreSQL smoke (db migrate --grant-to, the server as the app role, a superuser refused)
        run: .github/scripts/image-postgres-smoke.sh packmoat-core:ci
