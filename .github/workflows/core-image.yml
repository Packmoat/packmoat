# The core image: on a merge to main, build dotnet/Dockerfile for linux/amd64 and linux/arm64, push it to
# ghcr.io/packmoat/packmoat-core by digest only, smoke-test the pushed amd64 image, SIGN it with cosign keyless (GitHub's OIDC identity
# for THIS workflow on main), attest its SBOM and build provenance, and only then tag it.
# No secret or key is used: the built-in token pushes.
# The image name is written out: a registry name must be lower case, and the owner of this repository is Packmoat, with a capital P.
# It is the only workflow here that may publish or attest an image; only it and Scorecard may ask for an identity token
# (CoreWorkflowTests). It never runs on a pull request,
# and the one guard on its job means a fork, or a run by hand from another branch, publishes nothing.
name: core-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-image
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    # Only this repository's main branch is published under the main tag and signed.
    if: github.repository == 'Packmoat/packmoat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/packmoat/packmoat-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64's runtime stage (adding the user, writing the packmoat-admin wrapper) runs under emulation; .NET builds natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only, with no tag: until it is smoke-tested and signed, nothing names it, so :main never points at an unchecked
      # or unsigned image. An image that fails below stays untagged in the registry.
      - name: Build and push by digest (linux/amd64 and linux/arm64 under one index; no provenance or SBOM entries in it; no tags yet)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dotnet
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          build-args: |
            PACKMOAT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      # The smoke tests run the pushed linux/amd64 image itself, pulled by its digest, so the image tested is the image published.
      - name: Pull the pushed linux/amd64 image by digest for the smoke tests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          index="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          if [[ "$(jq '.manifests | length' <<< "${index}")" -ne 2 ]]; then echo "expected 2 platform images in ${DIGEST}" >&2; exit 1; fi
          amd64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "${index}")"
          docker pull "${IMAGE}@${amd64}"
          docker tag "${IMAGE}@${amd64}" packmoat-core:smoke
          echo "smoke-testing ${IMAGE}@${amd64} (linux/amd64 in ${DIGEST})"
      - name: Image smoke (Entrypoint, packmoat-admin --help, /healthz 200 with dummy settings)
        run: .github/scripts/image-smoke.sh packmoat-core:smoke /app/host/Packmoat.Server.dll
      - name: Image PORT smoke (PORT=9090 moves the server and its health check; PORT=0 stops it)
        run: .github/scripts/port-smoke.sh packmoat-core:smoke 9090
      - name: Image PostgreSQL smoke (db migrate --grant-to, the server as the app role, a superuser refused)
        run: .github/scripts/image-postgres-smoke.sh packmoat-core:smoke
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the index and each platform's image (keyless), then check every signature straight away
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          platforms="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" | jq -r '.manifests[].digest')"
          if [[ "$(wc -l <<< "${platforms}")" -ne 2 ]]; then echo "expected 2 platform images, got: ${platforms}" >&2; exit 1; fi
          for d in "${DIGEST}" ${platforms}; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-image.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}@${d}" > /dev/null
            echo "verified ${IMAGE}@${d}"
          done
      # SBOM and provenance, before the tags, as the signature is, so a tag never names an image without them. BuildKit's own
      # (provenance, sbom) stay off: they would add entries to the index. Instead syft lists each platform's image (an SPDX SBOM), and
      # actions/attest signs each SBOM for that platform's digest and a SLSA build provenance for the index digest, keyless as cosign
      # does. GitHub stores them, where gh attestation verify finds them; nothing more is pushed to the registry.
      - name: Find each platform's digest in the index
        id: platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          index="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          for arch in amd64 arm64; do
            d="$(jq -r --arg arch "${arch}" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<< "${index}")"
            if [[ ! "${d}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "no single linux/${arch} image in ${DIGEST}: ${d}" >&2; exit 1; fi
            echo "${arch}=${d}" >> "$GITHUB_OUTPUT"
          done
      - name: SBOM of the linux/amd64 image (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: registry:${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the linux/arm64 image (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: registry:${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the linux/amd64 SBOM to that image's digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
      - name: Attest the linux/arm64 SBOM to that image's digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
      - name: Attest the build provenance (SLSA) to the index digest, which the tags will name
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
      # Only now is the image named. With one source, imagetools create copies the index as it is, so each tag names the signed digest;
      # the check below fails the run if it ever did not.
      - name: Tag the signed index sha-<commit> and main
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:sha-${GITHUB_SHA}" --tag "${IMAGE}:main" "${IMAGE}@${DIGEST}"
          for tag in "sha-${GITHUB_SHA}" main; do
            got="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:${tag}" | jq -r .digest)"
            if [[ "${got}" != "${DIGEST}" ]]; then echo "${IMAGE}:${tag} is ${got}, not the signed ${DIGEST}" >&2; exit 1; fi
            echo "${IMAGE}:${tag} is ${DIGEST}"
          done
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published the core image"
            echo "- image: \`${IMAGE}@${DIGEST}\` (linux/amd64 and linux/arm64)"
            echo "- tags: \`sha-${GITHUB_SHA}\`, \`main\`"
            echo "- signed by: \`https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-image.yml@refs/heads/main\`"
          } >> "$GITHUB_STEP_SUMMARY"
